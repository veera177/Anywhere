spring.application.name=start-app
server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/anywhere?useUnicode=true&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=sql205071
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.sql.init.mode=never
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# UTF-8 Encoding (fixes garbled ₹, ⭐, emoji symbols)
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true

# JWT Configuration
jwt.secret=${JWT_SECRET:your-secret-key-change-in-production-env-variable}
jwt.expiration.ms=${JWT_EXPIRATION:25200000}

razorpay.key.id=${RAZORPAY_KEY_ID:}
razorpay.key.secret=${RAZORPAY_KEY_SECRET:}
ai.provider=${AI_PROVIDER:ollama}
ollama.api.url=${OLLAMA_API_URL:http://localhost:11434/api/generate}
ollama.embed.url=${OLLAMA_EMBED_URL:http://localhost:11434/api/embed}
ollama.model=${OLLAMA_MODEL:llama3.2}
ollama.embed.model=${OLLAMA_EMBED_MODEL:nomic-embed-text}
gemini.api.key=${GEMINI_API_KEY:}

# ChromaDB & RAG Configuration
chroma.url=${CHROMA_URL:http://localhost:8000}
chroma.collection=${CHROMA_COLLECTION:anywhere_knowledge}
rag.distance.threshold=${RAG_DISTANCE_THRESHOLD:0.45}
